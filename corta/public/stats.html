<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta: estadísticas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Estadísticas</h1>
    <p class="sub">Consultá los números de un link corto</p>

    <form id="form-stats">
      <input type="text" id="codigo" placeholder="ej: abc123xy" required maxlength="8" pattern="[a-z0-9]{8}">
      <button type="submit" id="btn-stats">Ver estadísticas</button>
    </form>

    <p id="error" class="error oculto" role="alert"></p>

    <div id="stats" class="stats oculto">
      <div class="stat"><span class="numero" id="stat-clicks">-</span><span class="etiqueta">clicks</span></div>
      <div class="stat"><span class="numero" id="stat-url">-</span><span class="etiqueta">URL original</span></div>
      <div class="stat"><span class="numero" id="stat-creado">-</span><span class="etiqueta">creado el</span></div>
    </div>

    <p class="pie"><a href="index.html">Volver a acortar</a></p>
  </main>

  <script>
    const form = document.getElementById('form-stats');
    const errorEl = document.getElementById('error');
    const statsEl = document.getElementById('stats');
    const btn = document.getElementById('btn-stats');

    function mostrarError(mensaje) {
      errorEl.textContent = mensaje;
      errorEl.classList.remove('oculto');
      statsEl.classList.add('oculto');
    }

    function limpiarError() {
      errorEl.textContent = '';
      errorEl.classList.add('oculto');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      limpiarError();
      btn.disabled = true;

      const codigo = document.getElementById('codigo').value.trim();

      try {
        const res = await fetch('/api/links/' + encodeURIComponent(codigo) + '/stats');
        let data = {};
        try {
          data = await res.json();
        } catch (_) {
          data = {};
        }

        if (res.status === 404) {
          mostrarError('Código no existe');
          return;
        }

        if (!res.ok) {
          mostrarError(data.error || 'Error del servidor');
          return;
        }

        document.getElementById('stat-clicks').textContent = data.clicks;
        document.getElementById('stat-url').textContent = data.url;
        document.getElementById('stat-creado').textContent = new Date(data.creado).toLocaleString();
        statsEl.classList.remove('oculto');
      } catch (err) {
        mostrarError('No se pudieron cargar las estadísticas');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
