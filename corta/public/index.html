<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta: acortador interno</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <img src="logo.png" alt="Corta" class="logo">
    <h1>Corta</h1>
    <p class="sub">El acortador de URLs interno</p>

    <form id="form">
      <input type="url" id="url" placeholder="https://una-url-muy-larga..." required>
      <button type="submit" id="btn-acortar">Acortar</button>
    </form>

    <p id="error" class="error oculto" role="alert"></p>

    <div id="resultado" class="oculto">
      <p>Código: <strong id="codigo"></strong></p>
      <p>Tu link corto:</p>
      <a id="link-corto" href="#" target="_blank"></a>
      <button id="copiar" type="button">Copiar</button>
    </div>

    <p class="pie"><a href="stats.html">Ver estadísticas de un link</a></p>
  </main>

  <script>
    const form = document.getElementById('form');
    const resultado = document.getElementById('resultado');
    const linkCorto = document.getElementById('link-corto');
    const codigoEl = document.getElementById('codigo');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('btn-acortar');

    function mostrarError(mensaje) {
      errorEl.textContent = mensaje;
      errorEl.classList.remove('oculto');
      resultado.classList.add('oculto');
    }

    function limpiarError() {
      errorEl.textContent = '';
      errorEl.classList.add('oculto');
    }

    async function acortar(url, reintento) {
      const res = await fetch('/api/links', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      let data = {};
      try {
        data = await res.json();
      } catch (_) {
        data = {};
      }

      if (res.status === 409 && !reintento) {
        return acortar(url, true);
      }

      if (!res.ok) {
        throw new Error(data.error || 'Error del servidor');
      }

      return data;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      limpiarError();
      btn.disabled = true;

      try {
        const url = document.getElementById('url').value;
        const data = await acortar(url, false);
        const corta = window.location.origin + data.corta;
        codigoEl.textContent = data.codigo;
        linkCorto.textContent = corta;
        linkCorto.href = corta;
        resultado.classList.remove('oculto');
      } catch (err) {
        mostrarError(err.message || 'No se pudo acortar la URL');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('copiar').addEventListener('click', () => {
      navigator.clipboard.writeText(linkCorto.textContent);
    });
  </script>
</body>
</html>
